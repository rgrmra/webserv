http{
	autoindex on;
	root ./var/www/html;
	server{
		listen 8080;
		server_name teste;
		location / {
			error_page 404 /404.html;
			fastcgi_pass /usr/bin/php-cgi;
		}
		return 200 OK;
	}
	server{
		listen 8080;
		server_name localhost;
		location / {
			root ./var/www/html/mysite;
			fastcgi_pass /usr/bin/python3;
		}
	}
	server{
		listen 8080;
		server_name meusite;
		location / {
			root /home/rgrmra/webserv/var/www/html;
		}
	}
}
